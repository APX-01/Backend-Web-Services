# Spring Application name
spring.application.name=eduhive-backend

# ? Spring DataSource configuration usando variables de entorno
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ? Spring Data JPA configuration
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:true}

# ? Hibernate configuration
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.open-in-view=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ? Naming strategy
spring.jpa.hibernate.naming.physical-strategy=com.education.eduhive.shared.infrastructure.persistence.jpa.configuration.strategy.SnakeCaseWithPluralizedTablePhysicalNamingStrategy

# ? Application Information
documentation.application.description=@project.description@
documentation.application.version=@project.version@

# ? JWT Configuration Properties usando variable de entorno
authorization.jwt.secret=${AUTHORIZATION_JWT_SECRET}
